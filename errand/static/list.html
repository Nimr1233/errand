<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Errand</title>
<style>
  :root { --bg: #021316; --card: #06262B; --line: #1F5F66; --text: #CFF6F8; --dim: #7FB8BD; --accent: #3FC8D0;
          --red: #FF5A52; --amber: #E39B2D; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, sans-serif; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px;
           border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); }
  h1 { font-size: 20px; margin: 0; letter-spacing: .05em; }
  h2 { font-size: 15px; margin: 0 0 8px; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; }
  main { padding: 12px 16px 40px; display: grid; gap: 12px; max-width: 640px; margin: 0 auto; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .bar { height: 10px; background: #0A2226; border-radius: 5px; overflow: hidden; margin: 8px 0; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .4s; }
  ul, ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
  li { overflow-wrap: anywhere; }
  .you li { border-left: 4px solid var(--red); padding-left: 10px; }
  .row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  button { font: inherit; min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--accent);
           background: transparent; color: var(--text); cursor: pointer; }
  button.go { background: var(--accent); color: #021316; border-color: var(--accent); font-weight: 600; }
  button:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
  #conn { font-size: 13px; color: var(--dim); }
  .huddle { color: var(--amber); }
  .small { font-size: 13px; color: var(--dim); }
  #updates li { font-size: 14px; }
</style>
</head>
<body>
<header><h1>ERRAND</h1><span id="conn" role="status">connecting…</span></header>
<main>
  <section class="card" aria-labelledby="jobname">
    <h2 id="jobname">Job</h2>
    <div id="pages" style="font-size:28px;font-weight:700">–</div>
    <div class="bar" role="progressbar" aria-label="pages done" aria-valuemin="0" aria-valuemax="100" id="barwrap"><div id="fill"></div></div>
    <p id="jobline" class="small"></p>
    <div class="row"><button id="pause" type="button">Pause all</button></div>
  </section>
  <section class="card you" aria-labelledby="youh"><h2 id="youh">Needs you</h2><ul id="needs"></ul></section>
  <section class="card" aria-labelledby="probh"><h2 id="probh">Problems</h2><p id="huddle" class="huddle"></p><ul id="board"></ul></section>
  <section class="card" aria-labelledby="fyh"><h2 id="fyh">For you</h2><ul id="foryou"></ul></section>
  <section class="card" aria-labelledby="uph"><h2 id="uph">Updates</h2><ol id="updates" aria-live="polite"></ol></section>
</main>
<script>
const TOKEN = '__TOKEN__';
const api = (path, body) => fetch(path, {method: body ? 'POST' : 'GET', credentials: 'same-origin',
  headers: {Authorization: 'Bearer ' + TOKEN, 'Content-Type': 'application/json'},
  body: body ? JSON.stringify(body) : undefined}).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
const el = (tag, text, cls) => { const e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; };
let paused = false;

function render(s, needs, board, ups) {
  document.getElementById('jobname').textContent = s.job;
  document.getElementById('pages').textContent = s.pages_done + ' / ' + s.total + ' pages';
  const pct = s.total ? Math.round(100 * s.pages_done / s.total) : 0;
  document.getElementById('fill').style.width = pct + '%';
  document.getElementById('barwrap').setAttribute('aria-valuenow', pct);
  const left = s.seconds_left ? ' · about ' + Math.ceil(s.seconds_left / 60) + ' min left' : '';
  document.getElementById('jobline').textContent = s.complete ? 'Complete · results: ' + s.results
    : !s.total ? 'No job yet. Start one from the chief\'s computer.'
    : (s.paused ? 'Paused' : (s.speed || 0).toFixed(1) + ' pages a second' + left) + ' · ' + s.blocked + ' blocked';
  paused = s.paused;
  document.getElementById('pause').textContent = paused ? 'Resume all' : 'Pause all';

  const ul = document.getElementById('needs');
  ul.replaceChildren(...(needs.length ? needs.map(a => {
    const li = el('li'); li.append(el('div', '#' + a.n + ': ' + a.reason));
    const row = el('div', null, 'row');
    const yes = el('button', 'Approve', 'go'), no = el('button', 'Skip');
    yes.type = no.type = 'button';
    yes.onclick = () => api('/api/problems/' + a.n, {approve: true}).then(refresh);
    no.onclick = () => api('/api/problems/' + a.n, {approve: false}).then(refresh);
    row.append(yes, no); li.append(row); return li;
  }) : [el('li', 'Nothing waits on you.', 'small')]));

  const h = board.huddle;
  document.getElementById('huddle').textContent = h ? 'Huddle ' + h.id + ' · ' + h.kind + ' on ' + h.site + ' · round ' + h.round + ' · ' + h.size + ' agents' : '';
  document.getElementById('board').replaceChildren(...[...board.waiting, ...board.recent].slice(0, 6)
    .map(p => el('li', p.id + ' · ' + p.kind + ' on ' + p.site + ' · ' + p.state, 'small')));
  document.getElementById('updates').replaceChildren(...ups.slice(-12).reverse().map(u => el('li', u.time.slice(0, 5) + ' ' + u.text)));
}

async function refresh() {
  try {
    const [s, needs, board, ups, tips] = await Promise.all([api('/api/status'), api('/api/agents?state=needs_you'),
                                                            api('/api/board'), api('/api/updates'), api('/api/foryou')]);
    render(s, needs, board, ups);
    document.getElementById('foryou').replaceChildren(...(tips.length ? tips.map(t => el('li', t.text))
      : [el('li', 'Suggestions appear after a few jobs.', 'small')]));
    document.getElementById('conn').textContent = 'live';
  } catch (e) {
    document.getElementById('conn').textContent = e.message === '401' ? 'signed out: reload to enter your PIN' : 'offline';
  }
}
document.getElementById('pause').onclick = () => api(paused ? '/api/resume' : '/api/pause', {}).then(refresh);
refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
