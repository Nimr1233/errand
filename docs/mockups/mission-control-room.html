c.fillText(finished===N?'MISSION COMPLETE · all '+TOTAL+' pages done':rate?rate.toFixed(1)+' pages a second · about '+(sec>=60?Math.floor(sec/60)+' min ':'')+(sec%60)+' s left':'measuring speed...',512,300);big.t.needsUpdate=true}
function deskDraw(i,label,value,sub){const d=deskMons[i],c=d.c;c.shadowBlur=0;c.fillStyle='#021316';c.fillRect(0,0,512,300);c.strokeStyle='#1F5F66';c.lineWidth=4;c.strokeRect(3,3,506,294);
c.textAlign='left';c.fillStyle='#62B9C1';c.font='32px '+MONO;c.fillText(label,24,56);c.shadowColor='#5CE1E6';c.shadowBlur=14;c.fillStyle='#5CE1E6';c.font='84px '+MONO;c.fillText(value,24,168);c.shadowBlur=0;c.fillStyle='#62B9C1';c.font='28px '+MONO;c.fillText(sub,24,246);d.t.needsUpdate=true}
function paint(){S.forEach(draw);
const q=queue(),open=S.filter(s=>s.st==='alert').length;
setTV('done',finished);setTV('hand',handoffs);setTV('prob',open,raised);bigDraw();
deskDraw(0,'WINDOWS IN USE',S.filter(s=>s.win).length+'/'+WIN,'private browser windows');
deskDraw(1,'BRAINS ONLINE',N+'/'+N,'all thinking at once');
deskDraw(2,'QUEUED FOR A WINDOW',String(q.length),q.length?'next: '+q.slice(0,3).map(s=>'#'+s.n).join(' '):'nobody waiting');
deskDraw(3,'LAST HAND-OFF',lastHand,'clean wipe in 0.15 s');
deskDraw(4,'SPEED',rate?rate.toFixed(1)+' p/s':'...','pages per second')}
const beams=[];
function beam(f,t){const p0=f.mesh.position.clone(),p2=t.mesh.position.clone(),p1=p0.clone().add(p2).multiplyScalar(0.35);p1.y+=1.2;
const curve=new THREE.QuadraticBezierCurve3(p0,p1,p2),line=new THREE.Line(new THREE.BufferGeometry().setFromPoints(curve.getPoints(40)),new THREE.LineBasicMaterial({color:0x4FD8E0,transparent:true,opacity:0.45}));
const ball=new THREE.Mesh(new THREE.SphereGeometry(0.05,10,8),new THREE.MeshBasicMaterial({color:0x7FF0F5,transparent:true,opacity:0.8}));scene.add(line);scene.add(ball);beams.push({curve,line,ball,t:0})}
function toast(msg){toastEl.textContent=msg;toastEl.style.opacity=1;setTimeout(()=>toastEl.style.opacity=0,2200)}
// silent = fast-forward at load: no beams, no drawing, and problems get handled as if you approved them
function sim(silent){
if(finished===N){if(++hold>16){reset();beams.forEach(b=>{scene.remove(b.line);scene.remove(b.ball)});beams.length=0}paint();return}
S.forEach(s=>{
if(s.st==='working'){s.prog+=s.speed;
if(s.prog>=1){s.prog=0;s.got++;pages++;
if(s.got>=s.need){s.st='finished';finished++;s.win=false;const w=queue()[0];
if(w){w.win=true;w.st='working';queue().forEach((x,j)=>x.line=j+1);handoffs++;s.gaveTo=w.n;lastHand='#'+s.n+' > #'+w.n;if(!silent)beam(s,w)}}}
else if(Math.random()<0.0008){s.st='alert';s.age=0;s.reason=REASONS[(s.n+raised)%REASONS.length];raised++}}
else if(s.st==='alert'&&silent&&++s.age>20)s.st='working'});
hist.push(pages);if(hist.length>9)hist.shift();
if(++tick%8===0||!rate)rate=hist.length>1?(hist[hist.length-1]-hist[0])/((hist.length-1)*STEP):0;
if(!silent)paint()}
reset();while(pages<612)sim(true);
const busy=S.filter(s=>s.st==='working');[busy[2],busy[9]].forEach(s=>{if(s){s.st='alert';s.reason=REASONS[(s.n+raised)%REASONS.length];raised++}});
const PITCH=0.04,FOV=66;let yaw=0,pitch=PITCH,fov=FOV,tYaw=null,tPitch=null,tFov=FOV,drag=false,lx=0,ly=0,moved=0;
el.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;drag=true;moved=0;lx=e.clientX;ly=e.clientY;el.style.cursor='grabbing'});
window.addEventListener('pointerup',e=>{if(drag&&moved<5)pick(e);drag=false;el.style.cursor='grab'});
window.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-lx,dy=e.clientY-ly;moved+=Math.abs(dx)+Math.abs(dy);yaw+=dx*0.005;pitch=Math.max(-0.6,Math.min(0.9,pitch+dy*0.004));lx=e.clientX;ly=e.clientY;tYaw=null;tPitch=null});
const ray=new THREE.Raycaster(),mv=new THREE.Vector2();
function flyTo(s){const prev=sel;sel=s;if(prev)draw(prev);draw(s);const d=s.mesh.position.clone().sub(CAM);tYaw=Math.atan2(-d.x,-d.z);tPitch=Math.atan2(d.y,Math.hypot(d.x,d.z));tFov=2*Math.atan(0.9/d.length())*180/Math.PI;
fixBtn.style.display=s.st==='alert'?'':'none';
selEl.textContent='> agent #'+s.n+(s.st==='alert'?' needs your attention: it '+s.reason+'.':s.st==='waiting'?' · queued, #'+s.line+' in line for a browser window':s.st==='finished'?' · finished all '+s.need+' pages · '+(s.gaveTo?'passed its window to #'+s.gaveTo:'closed its window'):' · running · page '+(s.got+1)+' of '+s.need+' · has a private browser window')}
function pick(e){const b=el.getBoundingClientRect();mv.x=(e.clientX-b.left)/b.width*2-1;mv.y=-(e.clientY-b.top)/b.height*2+1;ray.setFromCamera(mv,cam);const h=ray.intersectObjects(S.map(s=>s.mesh))[0];if(h)flyTo(h.object.userData)}
fixBtn.onclick=()=>{if(sel&&sel.st==='alert'){sel.st='working';fixBtn.style.display='none';selEl.textContent='> agent #'+sel.n+' is back to work.';toast('agent #'+sel.n+' is back to work');paint()}};
let ni=0;document.getElementById('cr-next').onclick=()=>{const n=S.filter(s=>s.st==='alert');if(!n.length){toast('no problems right now');return}flyTo(n[ni++%n.length])};
document.getElementById('cr-back').onclick=()=>{tFov=FOV;tYaw=0;tPitch=PITCH;const prev=sel;sel=null;if(prev)draw(prev);fixBtn.style.display='none';selEl.textContent=HINT};
const clock=new THREE.Clock();let t=0;function loop(){requestAnimationFrame(loop);t++;aurora.uniforms.t.value=clock.getElapsedTime();
if(tYaw!==null){let d=tYaw-yaw;d=Math.atan2(Math.sin(d),Math.cos(d));yaw+=d*0.06}if(tPitch!==null)pitch+=(tPitch-pitch)*0.06;fov+=(tFov-fov)*0.06;cam.fov=fov;cam.updateProjectionMatrix();cam.rotation.set(pitch,yaw,0,'YXZ');
if(t%45===0)sim(false);
for(let i=beams.length-1;i>=0;i--){const b=beams[i];b.t+=0.008;if(b.t<=1)b.ball.position.copy(b.curve.getPoint(b.t));else{b.line.material.opacity-=0.015;b.ball.material.opacity-=0.03;if(b.line.material.opacity<=0){scene.remove(b.line);scene.remove(b.ball);beams.splice(i,1)}}}
ren.render(scene,cam)}
document.fonts.load('124px "Share Tech Mono"').finally(()=>{S.forEach(s=>s.sig='');Object.keys(TV).forEach(tvDraw);paint()});
paint();loop();
</script>
